name: tactica
type: laravel
docroot: public
php_version: "8.4"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames:
  # needed for multitenancy
  - '*.tactica'
additional_fqdns: []
database:
    type: postgres
    version: '18'
use_dns_when_possible: true
composer_version: "2"
web_environment: []
corepack_enable: false

web_extra_exposed_ports:
  - name: vite
    container_port: 5173
    http_port: 5172
    https_port: 5173
