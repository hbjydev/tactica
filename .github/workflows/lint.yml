name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Set up repo
        uses: ./.github/actions/setup-repo

      - name: Run Pint
        run: ddev composer lint

      - name: Format Frontend
        run: ddev bun run format

      - name: Lint Frontend
        run: ddev bun run lint

      # - name: Commit Changes
      #   uses: stefanzweifel/git-auto-commit-action@v7
      #   with:
      #     commit_message: fix code style
      #     commit_options: '--no-verify'
